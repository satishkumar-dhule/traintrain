<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailCompanion</title>
  <link rel="stylesheet" href="/styles.css?v=8" />
</head>
<body>
  <div id="app" class="shell">
    <header class="mobile-header">
      <div class="brand"><span class="logo">RC</span> RailCompanion</div>
      <div class="shell-search" id="shell-search">
        <input id="shell-search-input" class="input" type="text" placeholder="Search station or train…" autocomplete="off" spellcheck="false" aria-label="Search station or train" />
        <div id="shell-search-menu" class="ac-menu hidden"></div>
      </div>
      <span id="mode-badge" class="badge badge-blue hidden">live</span>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="brand brand-lg"><span class="logo">RC</span> <span>RailCompanion</span></div>
        <nav id="side-nav" class="side-nav"></nav>
        <div class="sidebar-footer">
          <div class="source-box">
            <p class="source-label">Data Mode</p>
            <p class="source-value"><span class="dot"></span> Live Integrated</p>
          </div>
        </div>
      </aside>

      <main id="main" class="main">
        <div id="tab-root"></div>
      </main>
    </div>

    <nav id="mobile-nav" class="mobile-nav"></nav>
  </div>

  <script src="/boot.js?v=6"></script>
  <script src="/ui.js?v=8"></script>
  <script src="/api.js?v=8"></script>
  <script src="/routes.js?v=1"></script>
  <script src="/sections/home.js?v=1"></script>
  <script src="/sections/track.js?v=1"></script>
  <script src="/sections/station.js?v=1"></script>
  <script src="/sections/plan.js?v=1"></script>
  <script src="/sections/pnr.js?v=1"></script>
  <script src="/sections/more.js?v=1"></script>
  <script src="/tabs/train_on_map.js?v=3"></script>
  <script src="/tabs/observability.js?v=7"></script>
  <script src="/app.js?v=7"></script>
</body>
</html>
