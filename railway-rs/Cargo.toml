[package]
name = "railway-rs"
version = "0.1.0"
edition = "2021"
description = "RailCompanion - Indian Railways companion (Rust rewrite, live data only)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "catch-panic", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"], default-features = false }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
urlencoding = "2"
async-trait = "0.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = "thin"

[lib]
name = "railway_rs"
path = "src/lib.rs"

[[bin]]
name = "railway-rs"
path = "src/main.rs"
